name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Reference implementation the backend's USB byte stream is compared against.
  FICHERO_PRINTER_REPO: https://github.com/krouis/fichero-printer.git
  FICHERO_PRINTER_COMMIT: 7948e5867600c152034e03c99ced51ea8ef41de7

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:13']
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - name: Install distribution packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git \
            python3 python3-pytest python3-usb cups cups-client cups-filters ghostscript \
            python3-pil python3-numpy python3-bleak
      - uses: actions/checkout@v4
      - name: Fetch reference fichero-printer (test only, never packaged)
        run: |
          git init -q /opt/fichero-printer
          git -C /opt/fichero-printer fetch -q --depth 1 "$FICHERO_PRINTER_REPO" "$FICHERO_PRINTER_COMMIT"
          git -C /opt/fichero-printer checkout -q FETCH_HEAD
      - name: Validate scripts and PPD
        run: |
          sh -n scripts/*.sh resources/autoconfig packaging/debian/* packaging/test-installed.sh
          cupstestppd -q resources/FICHERO-D11s.ppd
      - name: Unit tests and USB stream comparison
        run: PYTHONPATH=/opt/fichero-printer python3 -m pytest -q -rs tests

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${{ github.ref_name }}" = "v$(cat VERSION)"
      - name: Build architecture-independent package
        run: sh scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/
          if-no-files-found: error

  lifecycle:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:13']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Install, hotplug, upgrade, remove offline in a disposable container
        run: sh scripts/test-deb.sh dist/*.deb ${{ matrix.image }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lifecycle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Publish installable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb dist/SHA256SUMS \
            --verify-tag --title "FICHERO Linux Printer ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md
